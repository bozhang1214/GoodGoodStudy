buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 21
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.8.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.4.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// 降级 androidx.core 相关依赖到与 AGP 8.1.1 / compileSdk 34 兼容的版本
allprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "androidx.core" &&
                    (details.requested.name == "core-ktx" || details.requested.name == "core")) {
                details.useVersion("1.12.0")
                details.because("Keep androidx.core at 1.12.0 for AGP 8.1.1 / compileSdk 34 compatibility")
            }
        }
    }
}
